version: '3.9'

# ---------------------------------------------------------------------------
# Shared environment anchor — override per-service via env_file or environment:
# ---------------------------------------------------------------------------
x-app-env: &app-env
  env_file: .env

services:
  postgres:
    image: postgres:15-alpine
    container_name: ratio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ratio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ratio_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ratio} -d ${POSTGRES_DB:-ratio_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ratio-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ratio-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    <<: *app-env
    environment:
      # Wired from docker network — overrides any host-level DATABASE_URL / REDIS_URL in .env
      DATABASE_URL: postgresql://${POSTGRES_USER:-ratio}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ratio_db}
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ratio-worker
    restart: unless-stopped
    <<: *app-env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ratio}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ratio_db}
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  ops-bot:
    build:
      context: .
      dockerfile: apps/ops-bot/Dockerfile
    container_name: ratio-ops-bot
    restart: unless-stopped
    <<: *app-env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ratio}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ratio_db}
      REDIS_URL: redis://redis:${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

      vllm:
    image: vllm/vllm-openai:latest
    container_name: ratio-vllm
    restart: unless-stopped
    ports:
      - "${LLM_PORT:-8080}:8000"
    environment:
      MODEL_NAME: ${LLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.2}
      TENSOR_PARALLEL_SIZE: "1"
      MAX_MODEL_LEN: "4096"
    command: >
      --host 0.0.0.0
      --port 8000
      --model ${LLM_MODEL:-mistralai/Mistral-7B-Instruct-v0.2}
      --max-model-len 4096
      --dtype float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["llm"]

volumes:
  postgres_data:
  redis_data:
