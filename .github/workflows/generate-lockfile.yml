name: Generate pnpm lockfile

on:
  push:
    paths:
      - '**/package.json'
      - 'pnpm-workspace.yaml'
    branches:
      - main
  workflow_dispatch: {}
jobs:
  generate-lockfile:
    name: pnpm install & commit lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies (generates pnpm-lock.yaml)
        run: pnpm install --no-frozen-lockfile
      - name: Check if lockfile is new or changed
        id: lockfile_check
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml 2>/dev/null; then
            if git diff --quiet pnpm-lock.yaml; then
              echo "status=unchanged" >> $GITHUB_OUTPUT
            else
              echo "status=changed" >> $GITHUB_OUTPUT
            fi
          else
            echo "status=new" >> $GITHUB_OUTPUT
          fi
      - name: Commit pnpm-lock.yaml
        if: steps.lockfile_check.outputs.status != 'unchanged'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: add generated pnpm-lock.yaml [skip ci]"
          git push
      - name: Switch Dockerfiles to --frozen-lockfile
        if: steps.lockfile_check.outputs.status == 'new'
        run: |
          for f in apps/api/Dockerfile apps/worker/Dockerfile apps/ops-bot/Dockerfile; do
            sed -i 's/--no-frozen-lockfile/--frozen-lockfile/g' "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/api/Dockerfile apps/worker/Dockerfile apps/ops-bot/Dockerfile
          git commit -m "chore: switch Dockerfiles to --frozen-lockfile now that pnpm-lock.yaml exists [skip ci]"
          git push
