version: '3.9'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ratio
      POSTGRES_USER: ratio
      POSTGRES_PASSWORD: change-me
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  execution-engine:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
