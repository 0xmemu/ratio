apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratio-execution-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ratio-execution-engine
  template:
    metadata:
      labels:
        app: ratio-execution-engine
    spec:
      containers:
        - name: execution-engine
          image: ratio/execution-engine:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: ratio-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
